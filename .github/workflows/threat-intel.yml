name: Automated Threat Intel Feed
on:
  schedule:
    # Monday, Wednesday, Friday at around 7:00 PM IST
    - cron: '30 13 * * 1,3,5'
    # Tuesday, Thursday late night at 11:15 PM IST
    - cron: '45 17 * * 2,4'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch latest CISA KEV data
        run: python update_feed.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update CISA KEV threat feed"
          title: "Automated Threat Feed Update"
          body: "Review the latest vulnerabilities pulled from the CISA catalog."
          branch: "automated-threat-update"
          delete-branch: true
