name: Automated Threat Intel Feed
on:
  schedule:
    # Monday, Wednesday, Friday at around 7:00 PM IST
    - cron: '30 13 * * 1,3,5'
    # Tuesday, Thursday late night at 11:15 PM IST
    - cron: '45 17 * * 2,4'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch latest CISA KEV data
        run: python update_feed.py

      - name: Commit and push changes
        run: |
          git config --global user.name "syed1coder"
          git config --global user.email "shadabsyed90@gmail.com"
          git add README.md
          
          # Only commit if there are actually changes to avoid script errors
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update CISA KEV threat feed"
          git push
