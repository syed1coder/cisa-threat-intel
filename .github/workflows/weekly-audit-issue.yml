name: Weekly SOC Audit Issue
on:
  schedule:
    # Runs every Monday morning at 9:30 AM IST (4:00 AM UTC)
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  create_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly SOC Log & Feed Review - Week $(date +'%V')" \
            --body "- [ ] Review recent automated CISA feed updates
            - [ ] Validate GitHub Actions workflow logs
            - [ ] Check for any Dependabot security alerts
            - [ ] Update incident response playbooks if new vulnerabilities apply" \
            --repo ${{ github.repository }}
